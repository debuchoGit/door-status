<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Door Status</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    background: #111;
    color: #fff;
  }

  #statusBox {
    text-align: center;
    line-height: 1.2;
    padding: 0 5vw;
    user-select: none;
  }

  #statusText {
    font-size: min(20vw, 280px);
    font-weight: 900;
  }
</style>
</head>

<body>
<div id="statusBox">
  <div id="statusText">読み込み中...</div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyDFZTW5ofKjs934I85R1wAkOEVvQCsjgZX5HrluwT5TUGikSkhcx3GWLr97jOaRCPa/exec";

const UPDATE_INTERVAL = 3000;
const RETRY_LIMIT = 5;
const REQUEST_TIMEOUT = 10000;

let lastStatus = null;
let errorCount = 0;

function applyStyle(status) {
  let bg = "#111";
  let fg = "#fff";

  switch (status) {
    case "入室可":
      bg = "#16a34a"; break;
    case "会議中":
      bg = "#dc2626"; break;
    case "電話中":
      bg = "#f59e0b";
      fg = "#111";
      break;
    case "作業中":
      bg = "#2563eb"; break;
    case "外出中":
      bg = "#6b7280"; break;
    case "不在":
    default:
      bg = "#111827"; break;
  }

  document.body.style.backgroundColor = bg;
  document.body.style.color = fg;
}

function showStatus(status) {
  if (status === lastStatus) return;

  document.getElementById("statusText").textContent = status;
  applyStyle(status);
  lastStatus = status;
}

async function updateStatus() {
  const controller = new AbortController();
  const timeout = setTimeout(() => {
    controller.abort();
  }, REQUEST_TIMEOUT);

  try {
    const res = await fetch(
      GAS_URL + "?t=" + Date.now(),
      {
        cache: "no-store",
        signal: controller.signal
      }
    );

    if (!res.ok) {
      throw new Error("HTTP " + res.status);
    }

    const data = await res.json();

    if (
      data.ok !== true ||
      typeof data.status !== "string"
    ) {
      throw new Error("Invalid response");
    }

    errorCount = 0;
    showStatus(data.status);

  } catch (e) {
    errorCount++;
    console.warn("通信失敗:", e);

    if (lastStatus === null && errorCount >= RETRY_LIMIT) {
      document.getElementById("statusText").textContent = "通信エラー";
      document.body.style.backgroundColor = "#111";
      document.body.style.color = "#fff";
    }

  } finally {
    clearTimeout(timeout);
    setTimeout(updateStatus, UPDATE_INTERVAL);
  }
}

updateStatus();
</script>
</body>
</html>
